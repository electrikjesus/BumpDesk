            <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#E8DEF8" stroke-width="1" />
        </pattern>
        <pattern id="expressiveDots" width="128" height="128" patternUnits="userSpaceOnUse">
            <circle cx="32" cy="32" r="3" fill="#D3BBFF" opacity="0.35" />
            <circle cx="96" cy="96" r="2" fill="#FFD8E4" opacity="0.25" />
