name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode signing keystore
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      run: |
        if [ -z "$SIGNING_KEY" ]; then
          echo "::error::SIGNING_KEY repository secret is not set. See keystore.properties.example."
          exit 1
        fi
        echo "$SIGNING_KEY" | base64 -d > app/release.keystore

    - name: Build APKs
      env:
        RELEASE_STORE_FILE: app/release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew assembleDebug assembleRelease

    - name: Verify release APK signature
      run: jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove signing keystore
      if: always()
      run: rm -f app/release.keystore
